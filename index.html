<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020611" />
    <meta name="description" content="Internet of Things links — Cyber Root Club" />
    <title>Internet of Things 26</title>
    <link rel="icon" type="image/png" href="assets/crc-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body data-community="false" data-major-icon="cpu">
    <canvas id="tech-canvas" aria-hidden="true"></canvas>
    <div class="tech-grid" aria-hidden="true"></div>
    <div class="scan-line" aria-hidden="true"></div>

    <main class="page-shell">
      <section class="profile-card" aria-labelledby="major-name">
        <div class="corner corner-top" aria-hidden="true"></div>
        <div class="corner corner-bottom" aria-hidden="true"></div>

        <header class="brand-lockup">
          <div class="logo-frame">
            <span class="orbit orbit-one" aria-hidden="true"></span>
            <span class="orbit orbit-two" aria-hidden="true"></span>
            <img src="assets/crc-logo.png" alt="Cyber Root Club logo" class="logo" />
          </div>
          <p class="club-name" lang="en">CYBER ROOT CLUB</p>
        </header>

        <div class="major-heading">
          <div id="major-icon" class="major-icon" aria-hidden="true"></div>
          <h1 id="major-name">Internet of Things <span class="cohort-number">26</span></h1>
        </div>

        <nav id="links-list" class="links-list" aria-label="Major links"></nav>
      </section>

      <footer lang="en">
        <span class="footer-signal" aria-hidden="true"></span>
        <p>© 2026 Cyber Root Club. All rights reserved.</p>
      </footer>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite">This link will be available soon.</div>
    <script src="assets/app.js"></script>
  </body>
</html>
